<!doctype html>
<html lang="de">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /></head>
  <body style="margin:0;background:#f4f6f9;color:#17315c;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f9;padding:24px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px;border:1px solid #dbe1ea;background:#ffffff;">
          <tr><td style="border-bottom:4px solid #e87722;padding:24px 28px;"><div style="font-size:23px;font-weight:700;color:#0d2650;">{{companyName}}</div><div style="margin-top:4px;font-size:12px;font-weight:700;text-transform:uppercase;color:#e87722;">Abgeschlossenes Übergabeprotokoll</div></td></tr>
          <tr><td style="padding:28px;">
            <p style="margin:0 0 18px;font-size:16px;">Guten Tag {{customerName}},</p>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#475569;">vielen Dank. Ihr Übergabeprotokoll {{protocolNumber}} zum Umzug am {{moveDate}} wurde abgeschlossen.</p>
            <p style="margin:0 0 22px;border-left:4px solid #e87722;background:#fff8f2;padding:12px 14px;font-size:14px;line-height:1.6;color:#475569;">Eine unveränderliche Ausfertigung finden Sie als PDF im Anhang dieser E-Mail.</p>
            <p style="margin:24px 0 0;font-size:15px;line-height:1.65;">Mit freundlichen Grüßen<br />{{senderName}}</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
